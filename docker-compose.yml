# Local test infrastructure for g8scope-core.
# Postgres holds everything: mutable state (issues etc.) and occurrences (partitioned).
# Ports are offset from defaults to avoid clashing with a local Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: g8scope
      POSTGRES_PASSWORD: g8scope
      POSTGRES_DB: g8scope_core_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g8scope -d g8scope_core_test"]
      interval: 3s
      timeout: 3s
      retries: 20
