# Local test infrastructure for g8scope-core.
# Postgres holds mutable state (issues etc.); ClickHouse holds occurrences.
# Ports are offset from defaults to avoid clashing with a local Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: g8scope
      POSTGRES_PASSWORD: g8scope
      POSTGRES_DB: g8scope_core_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g8scope -d g8scope_core_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_USER: g8scope
      CLICKHOUSE_PASSWORD: g8scope
      CLICKHOUSE_DB: g8scope_core_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9001:9000"   # native (9000 is taken locally by php-fpm)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20
